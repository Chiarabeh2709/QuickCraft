{% extends "base.html" %}

{% block title %}Terms of Use | QuickCraft{% endblock %}

{% block content %}
<div class="narrow-form" style="max-width: 44rem">
  <h1 class="h3">Terms of Use</h1>
  {% include "legal/_terms_text.html" %}
  {% if not current_user.is_authenticated %}
    <p class="mt-4"><a href="{{ url_for('auth.signup_customer') }}">Sign up as a customer</a> or
      <a href="{{ url_for('auth.signup_tradesperson') }}">as a tradesperson</a></p>
  {% endif %}
</div>
{% endblock %}
